[package]
name = "cargo-diet"
version = "1.4.1"
authors = ["Sebastian Thiel <byronimo@gmail.com>"]
edition = "2024"
repository = "https://github.com/the-lean-crate/cargo-diet"
include = ["src/**/*", "LICENSE.md", "README.md"]
license = "MIT"
readme = "README.md"
description = "Make your crate lean by computing size-optimal include directives for Cargo manifests"
categories = [
    "development-tools",
    "development-tools::cargo-plugins",
]
keywords = [
    "cargo",
    "cargo-subcommand",
    "cli",
    "lean",
    "crates",
]

[features]
default = []
dev-support = ["rmp-serde"]

[dependencies]
anyhow = "1.0.102"
quick-error = "2.0.1"
toml_edit = "0.25.12"
bytesize = "2.3.1"
criner-waste-report = { version = "0.1.5", default-features = false }
similar = "3.1.1"
ascii_table = { version = "5.0.0", features = ["auto_table_width"] }
tar = "0.4.46"
flate2 = "1.1.9"
rmp-serde = { version = "1.3.1", optional = true }
argh = "0.1.19"
json = "0.12.4"
nu-ansi-term = "0.50.3"

[[bin]]
name="cargo-diet"
path="src/bin/main.rs"

[profile.release]
panic = 'abort'
lto = "fat"
codegen-units = 1
incremental = false
overflow-checks = true
opt-level="s"
build-override = { opt-level = 0 }
