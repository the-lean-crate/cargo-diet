name: Prepare release
description: Bump versions and refresh the changelog using cargo-smart-release.
outputs:
  changed:
    description: Whether any release changes were produced.
    value: ${{ steps.prepare.outputs.changed }}
runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable

    - name: Install cargo-smart-release
      uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
      with:
        tool: cargo-smart-release

    - name: Prepare release
      id: prepare
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        base_sha="$(git rev-parse HEAD)"

        cargo smart-release \
          --bump auto \
          --bump-dependencies auto \
          --no-tag --no-push --no-publish \
          --no-changelog --no-changelog-github-release \
          --update-crates-index \
          --allow-fully-generated-changelogs \
          --execute

        cargo changelog --write || true

        if git diff --quiet "$base_sha" HEAD && git diff --quiet; then
          git reset --hard "$base_sha"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No release changes to propose."
          exit 0
        fi

        git add -A
        if ! git diff --cached --quiet; then
          git commit -m "chore: prepare release" --allow-empty
        fi

        echo "changed=true" >> "$GITHUB_OUTPUT"
