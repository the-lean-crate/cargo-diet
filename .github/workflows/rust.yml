name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:

    runs-on: ubuntu-latest
    env:
      SIZE_LIMIT: 15.0KB
      CARGO_TERM_COLOR: never
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable
        components: clippy, rustfmt
    - name: Cache cargo and target
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - name: Run tests
      run: make tests
    - name: Check crate package size
      run: cargo run -- diet --dry-run --package-size-limit ${{ env.SIZE_LIMIT }}
    - name: Check crate package size (with install action)
      run: cargo install cargo-diet --locked
    - name: Check crate package size (with latest binary)
      run: |
        curl -LSfs https://raw.githubusercontent.com/the-lean-crate/cargo-diet/master/ci/install.sh | \
            sh -s -- --git the-lean-crate/cargo-diet --target x86_64-unknown-linux-musl --force


        cargo diet --dry-run --package-size-limit ${{ env.SIZE_LIMIT }}
    - name: fmt
      run: cargo fmt --all -- --check
    - name: clippy
      run: cargo clippy --all-targets -- -D warnings

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
